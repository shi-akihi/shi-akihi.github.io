<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog · Chenyang Shi</title>
  <link rel="stylesheet" href="../stylesheet.css">
  <style>
    .blog-page { max-width: 800px; margin: 0 auto; padding: 40px 24px 64px; }
    .blog-nav { margin-bottom: 48px; }
    .blog-nav a { margin-right: 18px; }
    .blog-title { font-size: 32px; margin: 0 0 8px; }
    .blog-subtitle { color: #666; margin: 0 0 36px; }
    .post-list { display: grid; gap: 18px; }
    .post-card { padding: 20px 22px; border: 1px solid #e5e7eb; border-radius: 10px; }
    .post-card h2 { margin: 0 0 6px; font-size: 21px; }
    .post-card h2 a { color: #222; }
    .post-meta { color: #777; font-size: 13px; margin: 0 0 10px; }
    .post-excerpt { margin: 0; line-height: 1.6; }
    .empty { color: #777; }
  </style>
</head>
<body>
  <main class="blog-page">
    <nav class="blog-nav"><a href="../">← Home</a></nav>
    <h1 class="blog-title">Blog</h1>
    <p class="blog-subtitle">Notes, ideas, and things I am learning.</p>
    <section id="post-list" class="post-list" aria-live="polite">
      <p class="empty">Loading posts…</p>
    </section>
  </main>
  <script>
    fetch('posts.json')
      .then(response => response.json())
      .then(posts => {
        const list = document.getElementById('post-list');
        if (!posts.length) {
          list.innerHTML = '<p class="empty">No posts yet.</p>';
          return;
        }
        list.innerHTML = posts.map(post => `
          <article class="post-card">
            <h2><a href="post.html?file=${encodeURIComponent(post.file)}">${post.title}</a></h2>
            <p class="post-meta">${post.date}</p>
            <p class="post-excerpt">${post.excerpt || ''}</p>
          </article>`).join('');
      })
      .catch(() => {
        document.getElementById('post-list').innerHTML = '<p class="empty">Unable to load posts.</p>';
      });
  </script>
</body>
</html>
